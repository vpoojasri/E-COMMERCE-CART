# ============================================================================
# Application Configuration (Environment Variable Backed with Lab Defaults)
# ============================================================================
# Connects to MySQL when DB_URL is set in the environment, or falls back to
# H2 in MySQL compatibility mode if DB_URL is not provided so the project runs
# out-of-the-box in any college lab machine and supports full MySQL connection.
# ============================================================================

db.driver=${DB_DRIVER:org.h2.Driver}
db.url=${DB_URL:jdbc:h2:file:./data/ecommerce_tracking_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
db.username=${DB_USERNAME:sa}
db.password=${DB_PASSWORD:}
hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
hibernate.hbm2ddl.auto=${HIBERNATE_DDL_AUTO:update}
hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}

# Hibernate Second-Level Cache & Query Cache
hibernate.cache.use_second_level_cache=${HIBERNATE_L2_CACHE:true}
hibernate.cache.use_query_cache=${HIBERNATE_QUERY_CACHE:true}
hibernate.generate_statistics=${HIBERNATE_STATS:true}

# File Uploads
upload.dir=${UPLOAD_DIR:./uploads/products}
upload.max_file_size=${MAX_UPLOAD_SIZE_BYTES:5242880}

# Initial Admin Setup (Only used if no ADMIN exists in DB)
admin.initial.email=${ADMIN_INITIAL_EMAIL:admin@ecommerce.edu}
admin.initial.password=${ADMIN_INITIAL_PASSWORD:Admin@123}
admin.initial.name=${ADMIN_INITIAL_NAME:Lab System Administrator}

# Automated Order Tracking Simulation (Disabled by default as required)
tracking.automation.enabled=${TRACKING_AUTOMATION_ENABLED:false}
tracking.automation.interval.ms=${TRACKING_AUTOMATION_INTERVAL_MS:25000}

# Server & CORS
server.port=${SERVER_PORT:8080}
cors.allowed.origins=${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

